<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1f2126">
<meta name="apple-mobile-web-app-title" content="GV Watch">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="application-name" content="GV Security Watch">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="format-detection" content="telephone=no">
<title>GV Security Watch</title>
<meta name="description" content="Security incident reporting and case management for Grandview Hotel, Singapore.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700;800;900&display=swap">
<style>
/* Layout: a charcoal command bar carrying the red GV mark, then one working pane per role. Red is the brand; severity colours carry the warnings. */
:root{
  --bg:#f3f3f4; --surface:#ffffff; --surface-2:#f7f7f8; --ink:#1c1d21; --ink-2:#50535b; --ink-3:#80838c;
  --line:#dcdde1; --accent:#25272d; --accent-ink:#ffffff; --brand:#d0102b; --brand-soft:#fde8ea; --focus:#2563eb;
  --bar:#1f2126; --bar-ink:#ffffff; --bar-ink-2:#b4b7bf; --bar-line:#33363d;
  --sev-low:#2f7d4f; --sev-low-bg:#e3f2e8; --sev-med:#946410; --sev-med-bg:#fbf0d7;
  --sev-high:#c2531a; --sev-high-bg:#fde7da; --sev-crit:#b3121f; --sev-crit-bg:#fbe0e1;
  --st-open:#b3121f; --st-assigned:#1d5fbf; --st-review:#946410; --st-resolved:#2f7d4f;
  --chart-1:#3b4250; --chart-grid:#e6e7ea;
  --shadow:0 1px 2px rgba(20,20,25,.06),0 4px 14px rgba(20,20,25,.05);
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121316; --surface:#1b1d21; --surface-2:#22252a; --ink:#ececef; --ink-2:#a7aab2; --ink-3:#7b7e87;
  --line:#30333a; --accent:#ececef; --accent-ink:#121316; --brand:#e8213c; --brand-soft:#3a1a1f; --focus:#7aa7ff;
  --bar:#0c0d0f; --bar-ink:#ffffff; --bar-ink-2:#9fa3ab; --bar-line:#24262b;
  --sev-low:#6ccf93; --sev-low-bg:#163327; --sev-med:#e6b450; --sev-med-bg:#3a2e14;
  --sev-high:#f08c55; --sev-high-bg:#3d2316; --sev-crit:#ff6b73; --sev-crit-bg:#45191d;
  --st-open:#ff6b73; --st-assigned:#7aa7ff; --st-review:#e6b450; --st-resolved:#6ccf93;
  --chart-1:#c9ccd3; --chart-grid:#2a2d33; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121316; --surface:#1b1d21; --surface-2:#22252a; --ink:#ececef; --ink-2:#a7aab2; --ink-3:#7b7e87;
  --line:#30333a; --accent:#ececef; --accent-ink:#121316; --brand:#e8213c; --brand-soft:#3a1a1f; --focus:#7aa7ff;
  --bar:#0c0d0f; --bar-ink:#ffffff; --bar-ink-2:#9fa3ab; --bar-line:#24262b;
  --sev-low:#6ccf93; --sev-low-bg:#163327; --sev-med:#e6b450; --sev-med-bg:#3a2e14;
  --sev-high:#f08c55; --sev-high-bg:#3d2316; --sev-crit:#ff6b73; --sev-crit-bg:#45191d;
  --st-open:#ff6b73; --st-assigned:#7aa7ff; --st-review:#e6b450; --st-resolved:#6ccf93;
  --chart-1:#c9ccd3; --chart-grid:#2a2d33; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent}
button,a,select,input,label,summary{touch-action:manipulation}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
h2{font-size:1.25rem;font-weight:800}
h3{font-size:1rem;font-weight:700}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:.85rem}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--ink-3)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:.5rem .9rem;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{opacity:.9}
.btn.red{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.danger{color:var(--sev-crit);border-color:var(--sev-crit)}
.btn.sm{padding:.3rem .6rem;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
label{font-weight:600;font-size:.9rem;display:block;margin-bottom:.3rem}
.req{color:var(--sev-crit)}
input[type=text],input[type=password],input[type=search],input[type=datetime-local],input[type=date],input[type=url],select,textarea{
  width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:.55rem .7rem;min-height:2.6rem}
textarea{min-height:6rem;resize:vertical}
.hint{font-size:.82rem;color:var(--ink-2);margin-top:.25rem}
.err{font-size:.82rem;color:var(--sev-crit);margin-top:.25rem;font-weight:600}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--sev-crit)}

/* GV mark */
.logo{display:flex;align-items:center;gap:.6rem}
.mark{display:block;width:2.4rem;height:2.4rem;border-radius:8px;flex:none}
.logo-name{font-weight:800;font-size:1.05rem;line-height:1.1;letter-spacing:.01em}
.logo-sub{font-size:.75rem;opacity:.75}

/* Login */
.login-wrap{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding-block:2rem;padding-inline:16px}
.login{width:100%;max-width:430px;background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--brand);border-radius:14px;padding:2rem;box-shadow:var(--shadow);display:grid;gap:1.1rem}
.login .mark{width:3.2rem;height:3.2rem;border-radius:10px}
.login .logo-name{font-size:1.35rem}
.demo{background:var(--surface-2);border:1px dashed var(--line);border-radius:8px;padding:.75rem;font-size:.82rem}
.demo table{width:100%;border-collapse:collapse}
.demo td{padding:.15rem .3rem;overflow-wrap:anywhere}
@media (max-width:420px){.demo table,.demo tbody,.demo tr{display:block}.demo tr{display:grid;grid-template-columns:auto 1fr;column-gap:.5rem;padding:.35rem 0;border-top:1px solid var(--line)}.demo tr:first-child{border-top:0}.demo td:first-child{grid-column:1/-1;font-weight:700}}

/* Shell */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:var(--bar-ink);border-bottom:1px solid var(--bar-line)}
.topbar-in{max-width:1240px;margin:0 auto;padding-block:.6rem;padding-inline:16px;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.topbar .btn{background:transparent;color:var(--bar-ink);border-color:var(--bar-line)}
.spacer{flex:1}
.live{display:inline-flex;align-items:center;gap:.4rem;font-size:.8rem;color:var(--bar-ink-2)}
.dot{width:8px;height:8px;border-radius:50%;background:#3fbf73;animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(63,191,115,.5)}70%{box-shadow:0 0 0 7px rgba(63,191,115,0)}100%{box-shadow:0 0 0 0 rgba(63,191,115,0)}}
@media (prefers-reduced-motion: reduce){.dot{animation:none}}
.user-chip{display:flex;align-items:center;gap:.5rem;font-size:.85rem}
.role{font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:.15rem .45rem;border-radius:5px;background:var(--brand);color:#fff}
.tabs{max-width:1240px;margin:0 auto;padding-inline:16px;display:flex;gap:.25rem;overflow-x:auto}
.tab{border:0;background:none;padding:.65rem .9rem;font-weight:600;color:var(--bar-ink-2);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--bar-ink)}
.tab[aria-selected=true]{color:var(--bar-ink);border-bottom-color:var(--brand)}
.tab .count{font-size:.72rem;background:var(--brand);color:#fff;border-radius:10px;padding:0 .4rem;margin-left:.35rem}

main{max-width:1240px;margin:0 auto;padding-block:1.25rem 3rem;padding-inline:16px;display:grid;grid-template-columns:minmax(0,1fr);gap:1.25rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1.25rem;min-width:0}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}

/* Role guide */
.guide-card{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--brand);border-radius:var(--r);padding:1.1rem 1.25rem;display:grid;gap:.75rem}
.guide-card .who{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.75rem;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:.7rem .8rem;font-size:.86rem}
.steps li::before{content:counter(s);display:inline-grid;place-items:center;width:1.4rem;height:1.4rem;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:.75rem;margin-right:.4rem}
@media (max-width:900px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.steps{grid-template-columns:1fr}}
.flow{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center;font-size:.8rem}
.flow .arrow{color:var(--ink-3)}
.cant{font-size:.82rem;color:var(--ink-2)}

/* Task queue */
.qhead{display:flex;align-items:center;gap:.6rem;justify-content:space-between;flex-wrap:wrap;margin-bottom:.6rem}
.qnum{font-weight:800;font-size:.75rem;background:var(--brand);color:#fff;border-radius:999px;padding:.05rem .5rem}
.qnum.zero{background:var(--surface-2);color:var(--ink-3);border:1px solid var(--line)}
.qitem{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:.75rem;align-items:center;padding:.6rem .75rem;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.qitem+.qitem{margin-top:.5rem}
.qitem .desc{min-width:0}
.qitem .note{font-size:.82rem;color:var(--ink-2);margin-top:.15rem}
@media (max-width:640px){.qitem{grid-template-columns:auto minmax(0,1fr)}.qitem .desc{grid-column:1/-1}.qitem .btn{grid-column:1/-1}}
.empty{font-size:.88rem;color:var(--ink-2);padding:.5rem 0;margin:0}

/* Alert banner */
.alert{border:1px solid var(--sev-crit);background:var(--sev-crit-bg);border-radius:var(--r);padding:1rem 1.25rem;display:grid;gap:.6rem}
.alert-head{display:flex;gap:.6rem;align-items:center;font-weight:800;color:var(--sev-crit)}
.alert-item{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;background:var(--surface);border-radius:8px;padding:.55rem .75rem;border:1px solid var(--line)}
.alert-item .desc{flex:1;min-width:200px}

/* Severity + status */
.sev{display:inline-flex;align-items:center;gap:.35rem;font-size:.75rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:.15rem .5rem;border-radius:999px;white-space:nowrap}
.sev::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.sev.low{color:var(--sev-low);background:var(--sev-low-bg)}
.sev.medium{color:var(--sev-med);background:var(--sev-med-bg)}
.sev.high{color:var(--sev-high);background:var(--sev-high-bg)}
.sev.critical{color:var(--sev-crit);background:var(--sev-crit-bg)}
.status{font-size:.78rem;font-weight:700;padding:.1rem .45rem;border-radius:5px;border:1px solid currentColor;white-space:nowrap}
.status.s-open{color:var(--st-open)} .status.s-assigned{color:var(--st-assigned)} .status.s-review{color:var(--st-review)} .status.s-resolved{color:var(--st-resolved)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1rem}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1rem 1.1rem;display:grid;gap:.2rem}
.kpi .v{font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi.crit{border-left:4px solid var(--sev-crit)}
.kpi .d{font-size:.8rem;color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:1.25rem;align-items:start}
.grid2b{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.25rem;align-items:start}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.grid2b{grid-template-columns:1fr}}

/* Charts */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--ink-2);font-family:var(--f-body);font-size:11px}
.bars{display:grid;gap:.5rem}
.bar-row{display:grid;grid-template-columns:minmax(0,11rem) minmax(0,1fr) 2.5rem;gap:.6rem;align-items:center;font-size:.85rem}
.bar-row .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{height:12px;background:var(--surface-2);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.bar-fill{height:100%;background:var(--chart-1);border-radius:6px}
.bar-row .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.sevbar{display:flex;height:28px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.sevbar div{display:grid;place-items:center;font-size:.75rem;font-weight:700;color:#fff;min-width:0}
.legend{display:flex;gap:1rem;flex-wrap:wrap;font-size:.8rem;margin-top:.6rem}
.legend span{display:inline-flex;align-items:center;gap:.35rem}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* Patterns */
.patterns{display:grid;gap:.6rem}
.pattern{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.75rem;align-items:start;padding:.75rem;border-radius:8px;background:var(--surface-2);border:1px solid var(--line)}
.pattern .tag{font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--brand);padding-top:.15rem;min-width:5.5rem}

/* Filters + table */
.filters{display:grid;grid-template-columns:minmax(0,2fr) repeat(5,minmax(0,1fr));gap:.6rem;align-items:end;margin-bottom:1rem}
@media (max-width:1000px){.filters{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.filters{grid-template-columns:1fr}}
.filters label{font-size:.75rem;color:var(--ink-2);margin-bottom:.15rem}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table.data{width:100%;border-collapse:collapse;font-size:.88rem;min-width:860px}
table.data th{text-align:left;background:var(--surface-2);font-size:.75rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);padding:.6rem .7rem;border-bottom:1px solid var(--line);white-space:nowrap}
table.data th button{all:unset;cursor:pointer}
table.data th button:focus-visible{outline:2px solid var(--focus)}
table.data td{padding:.6rem .7rem;border-bottom:1px solid var(--line);vertical-align:top}
table.data tr:last-child td{border-bottom:0}
table.data tr.is-crit td:first-child{box-shadow:inset 4px 0 0 var(--sev-crit)}
table.data td.desc{max-width:300px}
table.data td.mono{white-space:nowrap}
.table-foot{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-top:.75rem;font-size:.85rem;color:var(--ink-2)}

/* Form */
.form-layout{max-width:880px;margin:0 auto;width:100%}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}
.form-grid .full{grid-column:1/-1}
.form-grid>*,.filters>*,.row>*{min-width:0}
input,select,textarea{max-width:100%;min-width:0}
input[type=datetime-local],input[type=date]{display:block}
@media (max-width:560px){.form-grid{grid-template-columns:1fr}}
.autofill{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.75rem;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:.75rem;font-size:.85rem}
@media (max-width:560px){.autofill{grid-template-columns:1fr}}
.autofill b{display:block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.sev-pick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.5rem}
@media (max-width:560px){.sev-pick{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sev-pick input{position:absolute;opacity:0;pointer-events:none}
.sev-pick label{margin:0;border:2px solid var(--line);border-radius:8px;padding:.55rem;text-align:center;cursor:pointer;font-size:.85rem;background:var(--surface)}
.sev-pick input:focus-visible+label{outline:3px solid var(--focus)}
.sev-pick input:checked+label.low{border-color:var(--sev-low);background:var(--sev-low-bg);color:var(--sev-low)}
.sev-pick input:checked+label.medium{border-color:var(--sev-med);background:var(--sev-med-bg);color:var(--sev-med)}
.sev-pick input:checked+label.high{border-color:var(--sev-high);background:var(--sev-high-bg);color:var(--sev-high)}
.sev-pick input:checked+label.critical{border-color:var(--sev-crit);background:var(--sev-crit-bg);color:var(--sev-crit)}
.guide{display:grid;gap:.6rem;font-size:.88rem}
.guide dl{margin:0;display:grid;gap:.5rem}
.guide dt{font-weight:700}
.guide dd{margin:0;color:var(--ink-2)}
.radio-row{display:flex;gap:1rem;flex-wrap:wrap}
.radio-row label{font-weight:500;display:flex;gap:.4rem;align-items:center;margin:0}
.confirm{border:1px solid var(--sev-low);background:var(--sev-low-bg);border-radius:var(--r);padding:1.25rem;display:grid;gap:.5rem}

/* Toast + modal */
.toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:.5rem;z-index:70;max-width:min(360px,calc(100vw - 32px))}
.toast{background:var(--bar);color:#fff;padding:.75rem 1rem;border-radius:8px;font-size:.88rem;box-shadow:var(--shadow);border-left:4px solid var(--brand)}
.toast.crit{background:var(--sev-crit);border-left-color:#fff}
.modal-back{position:fixed;inset:0;background:rgba(10,10,14,.55);display:grid;place-items:center;z-index:60;padding:16px}
.modal{background:var(--surface);border-radius:12px;max-width:760px;width:100%;padding:1.25rem;display:grid;grid-template-columns:minmax(0,1fr);gap:1rem;max-height:92vh;max-height:92dvh;overflow:auto;overscroll-behavior:contain}
.modal>*{min-width:0}
.kv dd{overflow-wrap:anywhere}
.modal pre{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:.75rem;max-height:300px;overflow:auto;font-size:.78rem;white-space:pre}
.kv{display:grid;grid-template-columns:9rem minmax(0,1fr);gap:.35rem .75rem;font-size:.9rem;margin:0}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.action-box{border:1px solid var(--line);border-radius:10px;padding:1rem;display:grid;gap:.7rem;background:var(--surface-2)}
.action-box h3{display:flex;gap:.5rem;align-items:center}
.instr{border-left:4px solid var(--st-assigned);background:var(--surface);padding:.6rem .8rem;border-radius:6px;font-size:.9rem}
.instr.fix{border-left-color:var(--st-review)}
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:.5rem;font-size:.86rem}
.timeline li{display:grid;grid-template-columns:7.5rem minmax(0,1fr);gap:.6rem;padding-bottom:.5rem;border-bottom:1px solid var(--line)}
.timeline li:last-child{border-bottom:0}
.sample-note{font-size:.8rem;background:var(--surface-2);border:1px dashed var(--line);border-radius:8px;padding:.5rem .75rem;color:var(--ink-2)}
.audit li{font-size:.85rem;padding:.35rem 0;border-bottom:1px solid var(--line)}
.audit{list-style:none;margin:0;padding:0;max-height:320px;overflow:auto}
.theme-switch{display:inline-flex;border:1px solid var(--bar-line);border-radius:8px;overflow:hidden}
.theme-switch button{border:0;background:transparent;color:var(--bar-ink-2);padding:.3rem .55rem;font-size:.78rem;font-weight:600;cursor:pointer}
.theme-switch button[aria-pressed=true]{background:var(--brand);color:#fff}
.login .theme-switch{border-color:var(--line);justify-self:end}
.login .theme-switch button{color:var(--ink-2)}
.login .theme-switch button[aria-pressed=true]{color:#fff}
.dot.off{background:#e8213c;animation:none}

    let hh=h.slice(0);
    for(let i=0;i<64;i++){

    const status=ageDays>10?(x>.1?"Resolved":"In progress"):(ageDays>3?(x>.4?"Resolved":"In progress"):(x>.5?"Open":"In progress"));
    const rec=Object.assign({id:"",occurredAt:occurred.toISOString(),reportedAt:reported.toISOString(),typeId:t,severity:sev,
      system:SYSTEMS[Math.floor(rnd()*SYSTEMS.length)],location:["Lobby front desk","Back office L1","Reservations office L2","Pool bar","Ballroom L3","Staff corridor B1","Concierge desk"][Math.floor(rnd()*7)],
      description:SAMPLE_TEXT[t][Math.floor(rnd()*2)],guestData:guest,reporterId:p[0],reporterName:p[1],dept:p[2],status,sample:true},blankCase());
    if(guest==="Yes"&&status==="Resolved") rec.pdpa="Not notifiable";
    const rt=reported.getTime(); rec.actions.push(act(rt,p[1],p[0]===MANAGER.empId?"manager":p[0]===IT.empId?"admin":"staff","Reported the incident"));
    if(status!=="Open"){
      const ack=Math.min(now-4e5,rt+(.3+rnd()*2)*36e5); rec.acknowledgedBy=IT.name; rec.acknowledgedAt=new Date(ack).toISOString();
      rec.assignedTo=IT.name; rec.assignedAt=rec.acknowledgedAt; rec.instruction=SAMPLE_INSTR[t];
      rec.actions.push(act(ack,IT.name,"admin","Started work: "+SAMPLE_INSTR[t]));
      if(status==="Resolved"){
        const cl=Math.min(now-2e5,ack+(1+rnd()*20)*36e5); rec.fixNote=SAMPLE_FIX[t]; rec.fixedAt=rec.closedAt=new Date(cl).toISOString();
        rec.actions.push(act(cl,IT.name,"admin","Resolved: "+SAMPLE_FIX[t]));
      }
    }
    out.push(rec);
  }
  /* A clear recurring pattern for the demo: failed logins on reservations over the last 3 days */
  for(let i=0;i<4;i++){
    const d=new Date(now-(i*17+5)*36e5);
    const rec=Object.assign({id:"",occurredAt:d.toISOString(),reportedAt:new Date(d.getTime()+20*6e4).toISOString(),typeId:"T02",severity:i===0?"high":"medium",
      system:"Property management system (PMS)",location:"Reservations office L2",description:"PMS account locked after failed logins I did not make. Happened again this shift.",
      guestData:"No",reporterId:"GV - 0005",reporterName:"Li Mei Chen",dept:"Reservations",status:i<2?"Open":"In progress",sample:true},blankCase());
    rec.actions.push(act(d.getTime()+20*6e4,"Li Mei Chen","staff","Reported the incident"));
    if(i>=2){ rec.acknowledgedBy=IT.name; rec.acknowledgedAt=new Date(d.getTime()+2*36e5).toISOString(); rec.assignedTo=IT.name; rec.assignedAt=rec.acknowledgedAt; rec.instruction=SAMPLE_INSTR.T02; rec.actions.push(act(d.getTime()+2*36e5,IT.name,"admin","Started work: "+SAMPLE_INSTR.T02)); }
    out.push(rec);
  }
  /* Two unacknowledged critical incidents so the alert panel has something to show */
  const c1=new Date(now-2.5*36e5), c2=new Date(now-26*36e5);
  [[c1,"T05","Email (Outlook)","Reservations office L2","Pre-arrival email with 46 guest names, emails and passport numbers was sent to an external address by mistake. Recall failed.","GV - 0006","Rajesh Kumar","Reservations",12],
   [c2,"T03","Property management system (PMS)","Back office L1","Overnight export of 3,100 guest profiles from a front desk login that was not in use at the time.","GV - 0008","Daniel Koh","Food & Beverage",40]].forEach(([d,t,sys,loc,desc,eid,nm,dp,m])=>{
    const rep=new Date(d.getTime()+m*6e4);
    const rec=Object.assign({id:"",occurredAt:d.toISOString(),reportedAt:rep.toISOString(),typeId:t,severity:"critical",system:sys,location:loc,description:desc,guestData:"Yes",reporterId:eid,reporterName:nm,dept:dp,status:"Open",sample:true},blankCase());
    rec.actions.push(act(rep,nm,"staff","Reported the incident")); out.push(rec);
  });
  out.sort((a,b)=>a.reportedAt.localeCompare(b.reportedAt));
  out.forEach((x,i)=>x.id="INC-"+String(1001+i));
  return out;
}

/* ---------- State ---------- */
let state={
  user:null, tab:null, knownStatus:new Map(), lastSync:new Date(),
  filters:{q:"",type:"",dept:"",sev:"",status:"",from:"",to:""},
  sort:{key:"reportedAt",dir:"desc"}, page:1, dashRange:"30", dashDept:""
};
function normalise(d){ let ch=false; d.forEach(i=>{ if(OLD_STATUS[i.status]){ i.status=OLD_STATUS[i.status]; ch=true; } if(OLD_IDS[i.reporterId]){ i.reporterId=OLD_IDS[i.reporterId]; ch=true; } }); return ch; }
function incidents(){ let d=store.get("incidents",null); if(!d){ d=shared()?[]:makeSampleData(); store.set("incidents",d); } else if(normalise(d)) store.set("incidents",d); return d; }
function saveIncidents(d,reason){ store.set("incidents",d); if(channel) try{channel.postMessage({t:"changed",reason})}catch(e){} }
function snapshotStatuses(){ state.knownStatus=new Map(incidents().map(i=>[i.id,i.status])); }
function audit(action,incidentId){
  const log=store.get("audit",[]); log.unshift({at:new Date().toISOString(),by:state.user?state.user.name:"system",role:state.user?state.user.role:"-",action,incidentId:incidentId||""});
  store.set("audit",log.slice(0,300));
  apiQuiet("audit",{entry:log[0]},"Could not write to the audit log.");
}
function typeName(id){ const t=INCIDENT_TYPES.find(x=>x.id===id); return t?t.name:id; }
/* Every case change goes through here, so it is saved, added to the case history and written to the audit log */
function updateCase(id,fn,logText){
  const d=incidents(), r=d.find(x=>x.id===id); if(!r) return null;
  fn(r); r.actions=r.actions||[]; r.actions.push({at:new Date().toISOString(),by:state.user.name,role:state.user.role,text:logText});
  saveIncidents(d,"case"); state.knownStatus.set(r.id,r.status);
  apiQuiet("update",{incident:r},"Could not save this change to the Google Sheet.");
  audit(logText.length>70?logText.slice(0,70)+"…":logText,id); return r;
}

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=iso=>{ const d=new Date(iso); return d.toLocaleDateString("en-SG",{day:"2-digit",month:"short"})+" "+d.toLocaleTimeString("en-SG",{hour:"2-digit",minute:"2-digit",hour12:false}); };
const fmtFull=iso=>{ const d=new Date(iso); return d.toLocaleDateString("en-SG",{day:"2-digit",month:"short",year:"numeric"})+", "+d.toLocaleTimeString("en-SG",{hour:"2-digit",minute:"2-digit",hour12:false}); };
const ago=iso=>{ const h=(Date.now()-new Date(iso))/36e5; return h<1?Math.max(1,Math.round(h*60))+" min ago":h<48?Math.round(h)+" h ago":Math.round(h/24)+" days ago"; };
const sevPill=s=>`<span class="sev ${s}">${s}</span>`;
const statusPill=s=>`<span class="status ${STATUS_CLASS[s]||""}" title="${esc(STATUS_HELP[s]||"")}">${esc(s)}</span>`;
function toast(msg,crit){ const t=document.createElement("div"); t.className="toast"+(crit?" crit":""); t.textContent=msg; $("#toasts").appendChild(t); setTimeout(()=>t.remove(),6000); }

/* ---------- Authentication ---------- */
function lockInfo(){ return store.get("lock",{fails:0,until:0}); }
function renderLogin(msg){
  const li=lockInfo(), locked=li.until>Date.now();
  $("#app").innerHTML=`
  <div class="login-wrap"><form class="login" id="loginForm" novalidate>
    ${themeSwitch()}
    ${logo("Security incident reporting · Grandview Hotel, Singapore")}
    <div><h1 style="font-size:1.35rem">Sign in</h1><p class="muted small" style="margin:.3rem 0 0">Use your hotel staff account. You are signed out after ${SESSION_TIMEOUT_MIN} minutes without activity.</p></div>
    <div class="field"><label for="lu">Username</label><input type="text" id="lu" autocomplete="username" required ${locked?"disabled":""}></div>
    <div class="field"><label for="lp">Password</label><input type="password" id="lp" autocomplete="current-password" required ${locked?"disabled":""}></div>
    ${msg?`<div class="err" role="alert">${esc(msg)}</div>`:""}
    ${locked?`<div class="err" role="alert">Too many failed attempts. Sign-in is locked until ${new Date(li.until).toLocaleTimeString("en-SG",{hour:"2-digit",minute:"2-digit"})}. Contact IT security if you need help sooner.</div>`:""}
    <button class="btn red" type="submit" ${locked?"disabled":""}>Sign in</button>
    ${CONFIG.SHOW_DEMO_LOGINS?`<div class="demo"><div class="eyebrow" style="margin-bottom:.35rem">Demo accounts for assessment</div>
      <table><tr><td>Hotel staff</td><td>Nicolas</td><td class="mono">nicolas</td><td class="mono">Staff@2026</td></tr>
      <tr><td>Security manager</td><td>Ravi</td><td class="mono">ravi</td><td class="mono">Manager@2026</td></tr>
      <tr><td>IT security officer</td><td>LIN</td><td class="mono">lin</td><td class="mono">Admin@2026</td></tr></table></div>`:`<p class="muted small" style="margin:0">Need access? Contact IT security.</p>`}
  </form></div>`;
  $("#loginForm").addEventListener("submit",e=>{
    e.preventDefault();
    const u=$("#lu").value.trim().toLowerCase(), p=$("#lp").value;
    if(!u||!p){ renderLogin("Enter both your username and password."); return; }
    const info=lockInfo(); if(info.until>Date.now()){ renderLogin(); return; }
    const user=USERS.find(x=>x.username===u);
    if(user && sha256("LINX-salt::"+u+"::"+p)===user.hash){
      store.set("lock",{fails:0,until:0});
      state.user=user; store.set("session",{username:u,last:Date.now()});
      state.tab=ROLE_TABS[user.role][0]; audit("Signed in"); autoSnap();
      renderShell();
    }else{
      const fails=(info.fails||0)+1, until=fails>=MAX_ATTEMPTS?Date.now()+LOCK_MIN*6e4:0;
      store.set("lock",{fails:until?0:fails,until});
      /* Failed attempts are logged locally and in the shared Audit Log sheet */
      const log=store.get("audit",[]), entries=[{at:new Date().toISOString(),by:u||"(blank)",role:"-",action:"Failed sign-in attempt",incidentId:""}];
      if(until) entries.push({at:new Date().toISOString(),by:u||"(blank)",role:"-",action:`Sign-in locked for ${LOCK_MIN} minutes after ${MAX_ATTEMPTS} failed attempts`,incidentId:""});
      entries.forEach(en=>{ log.unshift(en); apiQuiet("audit",{entry:en},"Could not write to the audit log."); }); store.set("audit",log.slice(0,300));
      renderLogin(until?"":`Username or password is incorrect. ${MAX_ATTEMPTS-fails} attempt${MAX_ATTEMPTS-fails===1?"":"s"} left before sign-in is locked for ${LOCK_MIN} minutes.`);
    }
  });
  bindTheme();
  if(!locked) $("#lu").focus();
}
function logout(reason){
  if(state.user) audit(reason==="timeout"?"Session timed out":"Signed out");
  document.querySelectorAll(".modal-back").forEach(m=>m.remove());
  state.user=null; store.set("session",null); renderLogin(reason==="timeout"?"You were signed out after "+SESSION_TIMEOUT_MIN+" minutes without activity.":"");
}
function touch(){ if(state.user) store.set("session",{username:state.user.username,last:Date.now()}); }
["click","keydown"].forEach(ev=>document.addEventListener(ev,touch,{passive:true}));
document.addEventListener("click",()=>{ const ap=$("#acctPanel"); if(ap&&!ap.hidden){ ap.hidden=true; const ab=$("#acctBtn"); if(ab) ab.setAttribute("aria-expanded","false"); } });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ const ap=$("#acctPanel"); if(ap&&!ap.hidden){ ap.hidden=true; $("#acctBtn").focus(); } } });

/* ---------- Work queues ---------- */
function unackedCritical(){ return incidents().filter(i=>i.severity==="critical"&&!i.acknowledgedBy&&i.status!=="Resolved"); }
function itQueues(){
  const d=incidents(), crit=unackedCritical(), critIds=new Set(crit.map(i=>i.id)), week=Date.now()-7*864e5;
  return {
    critical:crit,
    open:d.filter(i=>i.status==="Open"&&!critIds.has(i.id)),
    progress:d.filter(i=>i.status==="In progress"),
    pdpa:d.filter(i=>i.guestData==="Yes"&&(i.pdpa==="Not assessed"||i.pdpa.startsWith("Notifiable"))),
    resolved:d.filter(i=>i.status==="Resolved"&&new Date(i.closedAt||i.reportedAt).getTime()>week)
  };
}
function tabCount(t){
  if(t==="itcases"){ const q=itQueues(); return q.critical.length+q.open.length; }
  return 0;
}

      <span class="desk-only">${themeSwitch()}</span>

      <div class="acct">
        <span class="dot liveDot" aria-hidden="true"></span>
        <button class="acct-btn" id="acctBtn" aria-expanded="false" aria-controls="acctPanel"><span class="av" aria-hidden="true">${esc(u.name.charAt(0))}</span>${esc(u.name)} <span aria-hidden="true">▾</span></button>
        <div class="acct-panel" id="acctPanel" hidden>
          <div class="row"><b>${esc(u.name)}</b><span class="role">${ROLE_LABEL[u.role]}</span></div>
          <span class="live small"><span class="dot liveDot" aria-hidden="true"></span><span class="liveText"></span></span>

      </div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Main">${tabs.map(t=>{const c=tabCount(t);return `<button class="tab" role="tab" data-tab="${t}" aria-selected="${state.tab===t}" aria-label="${TAB_LABEL[t]}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${TAB_ICON[t]}"/></svg><span class="t-long">${TAB_LABEL[t]}</span><span class="t-short">${TAB_SHORT[t]}</span>${c?`<span class="count">${c}</span>`:""}</button>`;}).join("")}</nav>

  <main id="main"></main>`;
  $("#logoutBtn").onclick=()=>logout();

  ab.onclick=e=>{ e.stopPropagation(); ap.hidden=!ap.hidden; ab.setAttribute("aria-expanded",String(!ap.hidden)); };
  ap.onclick=e=>e.stopPropagation();
  bindTheme(); paintLive();
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{ state.tab=b.dataset.tab; state.page=1; renderShell(); scrollTo(0,0); });
  snapshotStatuses();
  ({report:renderReport,mine:renderMine,itcases:renderItCases,dashboard:renderDashboard,log:renderLog,system:renderSystem})[state.tab]();
  bindOpenButtons(); paintLive();
}

function qList(items,emptyText,noteFn){
  if(!items.length) return `<p class="empty">${emptyText}</p>`;
  const sorted=[...items].sort((a,b)=>SEV_RANK[b.severity]-SEV_RANK[a.severity]||a.reportedAt.localeCompare(b.reportedAt));
  return sorted.map((i,ix)=>`<div class="qitem"${ix>=5?" hidden":""}>
    <span class="mono"><b>${i.id}</b></span>${sevPill(i.severity)}
    <div class="desc">${esc(typeName(i.typeId))} · ${esc(i.dept)} · reported ${ago(i.reportedAt)}${noteFn?`<div class="note">${noteFn(i)}</div>`:""}</div>
    <button class="btn sm primary" data-view="${i.id}">Open case</button></div>`).join("")+(sorted.length>5?`<button class="btn more-btn" data-more>Show all ${sorted.length}</button>`:"");
}
const qHead=(n,title,hint)=>`<div class="qhead"><div><h3>${title} <span class="qnum ${n?"":"zero"}">${n}</span></h3>${hint?`<div class="muted small">${hint}</div>`:""}</div></div>`;

/* ---------- Case panel ---------- */
function openCase(id,quiet){
  const i=incidents().find(x=>x.id===id); if(!i) return;
  const role=state.user.role;
  document.querySelectorAll(".modal-back").forEach(m=>m.remove());
  const back=document.createElement("div"); back.className="modal-back";
  const parts=[];
  if(role==="admin"){
    const workBox=(lbl,ph,btns)=>`<div class="field"><label for="cWork">${lbl}</label><textarea id="cWork" placeholder="${ph}"></textarea><div class="err" hidden>Write at least 10 characters.</div></div><div class="row">${btns}</div>`;
    if(!i.acknowledgedBy&&i.status!=="Resolved") parts.push(`<div class="row"><button class="btn red" id="cAck">Acknowledge</button></div>`);
    if(i.status!=="Resolved") parts.push(`<div class="row"><label for="cSev" style="margin:0">Severity</label><select id="cSev" style="width:auto">${SEVERITIES.map(s=>`<option value="${s}" ${i.severity===s?"selected":""}>${s}</option>`).join("")}</select></div>`);
    if(i.status==="Open") parts.push(workBox("Action plan","For example: reset the password, check the login history and turn on MFA.",`<button class="btn primary" id="cStart">Start work</button>`));
    if(i.status==="In progress"){
      if(i.instruction) parts.push(`<div class="instr"><b>Action plan:</b> ${esc(i.instruction)}</div>`);
      parts.push(workBox("Work note","For example: password reset, IP 203.0.113.7 blocked, MFA turned on.",`<button class="btn" id="cProgress">Save note</button><button class="btn primary" id="cResolve">Resolve case</button>`));
    }
    if(i.status==="Resolved") parts.push(`<div class="instr fix"><b>Resolution:</b> ${esc(i.fixNote||"")}</div><div class="row"><button class="btn" id="cReopen">Reopen case</button></div>`);
    parts.push(`<div class="row"><label for="cPdpa" style="margin:0">PDPA decision</label><select id="cPdpa" style="width:auto">${PDPA.map(p=>`<option ${i.pdpa===p?"selected":""}>${p}</option>`).join("")}</select>${i.guestData==="Yes"?`<span class="small" style="color:var(--sev-crit);font-weight:700">Guest data involved</span>`:""}</div>`);
    parts.push(`<div id="delZone"></div><div class="row"><button class="btn danger sm" id="cDel">Delete record</button></div>`);
  }
  back.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
    <div class="row" style="justify-content:space-between"><h2 id="mt"><span class="mono">${i.id}</span> · ${esc(typeName(i.typeId))}</h2><div class="row">${sevPill(i.severity)}${statusPill(i.status)}</div></div>
    <dl class="kv"><dt>Occurred</dt><dd>${fmtFull(i.occurredAt)}</dd><dt>Reported</dt><dd>${fmtFull(i.reportedAt)} by ${esc(i.reporterName)} (${esc(i.reporterId)}), ${esc(i.dept)}</dd>
    <dt>System</dt><dd>${esc(i.system)}</dd><dt>Location</dt><dd>${esc(i.location)}</dd><dt>Guest data</dt><dd>${esc(i.guestData)}</dd><dt>PDPA</dt><dd>${esc(i.pdpa)}</dd>
    <dt>Handled by</dt><dd>${i.assignedTo?esc(i.assignedTo)+", since "+fmtFull(i.assignedAt):"Not started"}</dd><dt>Description</dt><dd>${esc(i.description)}</dd>
    ${role!=="admin"&&i.instruction?`<dt>Action plan</dt><dd>${esc(i.instruction)}</dd>`:""}${role!=="admin"&&i.fixNote?`<dt>Resolution</dt><dd>${esc(i.fixNote)}</dd>`:""}</dl>
    ${parts.length?`<div class="action-box"><h3>Actions</h3>${parts.join("")}</div>`:""}
    <div><h3 style="margin-bottom:.5rem">Case history</h3><ul class="timeline">${(i.actions||[]).map(a=>`<li><span class="mono small">${fmt(a.at)}</span><span><b>${esc(a.by)}</b> <span class="muted">(${esc(ROLE_LABEL[a.role]||a.role)})</span>: ${esc(a.text)}</span></li>`).join("")}</ul></div>
    <div class="row" style="justify-content:flex-end"><button class="btn" id="closeM">Close</button></div></div>`;
  document.body.appendChild(back);
  const close=()=>{ back.remove(); rerender(); };
  const done=(msg)=>{ toast(msg); back.remove(); rerender(); openCase(id,true); };
  $("#closeM",back).onclick=close;
  back.onclick=e=>{ if(e.target===back) close(); };
  back.addEventListener("keydown",e=>{ if(e.key==="Escape") close(); });
  const need=(sel,min)=>{ const el=$(sel,back), ok=el&&el.value.trim().length>=min; const fld=el.closest(".field"); fld.classList.toggle("invalid",!ok); $(".err",fld).hidden=ok; if(!ok) el.focus(); return ok?el.value.trim():null; };
  const on=(sel,fn)=>{ const el=$(sel,back); if(el) el.onclick=fn; };
  back.querySelectorAll("textarea").forEach(t=>t.addEventListener("input",()=>{ const fld=t.closest(".field"); if(fld&&t.value.trim().length>=10){ fld.classList.remove("invalid"); $(".err",fld).hidden=true; } }));
  const ackFields=r=>{ if(!r.acknowledgedBy){ r.acknowledgedBy=IT.name; r.acknowledgedAt=new Date().toISOString(); } };
  on("#cAck",()=>{ updateCase(id,ackFields,"Acknowledged the case"); done(id+" acknowledged."); });
  const sevSel=$("#cSev",back); if(sevSel) sevSel.onchange=()=>{ const old=i.severity; updateCase(id,r=>r.severity=sevSel.value,`Changed severity from ${old} to ${sevSel.value}`); done("Severity updated."); };
  on("#cStart",()=>{ const t=need("#cWork",10); if(!t) return; updateCase(id,r=>{ ackFields(r); r.status="In progress"; r.assignedTo=IT.name; r.assignedAt=new Date().toISOString(); r.instruction=t; },"Started work: "+t); done(id+" is in progress."); });
  on("#cProgress",()=>{ const t=need("#cWork",10); if(!t) return; updateCase(id,()=>{},"Progress note: "+t); done("Note saved."); });
  on("#cResolve",()=>{ const t=need("#cWork",10); if(!t) return; updateCase(id,r=>{ const now=new Date().toISOString(); r.status="Resolved"; r.fixNote=t; r.fixedAt=now; r.closedAt=now; },"Resolved: "+t); done(id+" resolved."); });
  on("#cReopen",()=>{ updateCase(id,r=>{ r.status="In progress"; r.closedAt=null; if(!r.assignedTo){ r.assignedTo=IT.name; r.assignedAt=new Date().toISOString(); } },"Reopened the case"); done(id+" reopened."); });
  const pd=$("#cPdpa",back); if(pd) pd.onchange=()=>{ updateCase(id,r=>r.pdpa=pd.value,"PDPA decision: "+pd.value); done("PDPA decision saved."); };
  on("#cDel",()=>{
    $("#delZone",back).innerHTML=`<div class="alert"><b>Delete ${i.id} permanently?</b><span class="small">This is recorded in the audit log.</span><div class="row"><button class="btn danger" id="delYes">Delete</button><button class="btn" id="delNo">Cancel</button></div></div>`;
    $("#delNo",back).onclick=()=>$("#delZone",back).innerHTML="";
    $("#delYes",back).onclick=()=>{ saveIncidents(incidents().filter(x=>x.id!==i.id),"delete"); apiQuiet("delete",{id:i.id},"Could not delete the case in the Google Sheet."); audit("Deleted record",i.id); toast(i.id+" deleted."); close(); };
  });
  if(!quiet) audit("Viewed case",id);
  $("#closeM",back).focus();
}

/* ---------- Part 2: Incident database ---------- */
function filtered(){
  const f=state.filters, q=f.q.toLowerCase();
  let d=incidents().filter(i=>
    (!f.type||i.typeId===f.type)&&(!f.dept||i.dept===f.dept)&&(!f.sev||i.severity===f.sev)&&(!f.status||i.status===f.status)&&
    (!f.from||i.reportedAt.slice(0,10)>=f.from)&&(!f.to||i.reportedAt.slice(0,10)<=f.to)&&
    (!q||[i.id,i.description,i.reporterName,i.system,i.location,typeName(i.typeId),i.dept,i.instruction,i.fixNote].join(" ").toLowerCase().includes(q)));
  const {key,dir}=state.sort, m=dir==="asc"?1:-1;
  d.sort((a,b)=>{ let x=a[key],y=b[key]; if(key==="severity"){x=SEV_RANK[x];y=SEV_RANK[y];} if(key==="typeId"){x=typeName(x);y=typeName(y);} if(key==="status"){x=STATUSES.indexOf(x);y=STATUSES.indexOf(y);} return (x>y?1:x<y?-1:0)*m; });
  return d;
}

function toCsv(rows){
  const cols=[["id","Incident ID"],["reportedAt","Reported at"],["occurredAt","Occurred at"],["typeId","Type"],["severity","Severity"],["system","System"],["location","Location"],["guestData","Guest data involved"],["dept","Department"],["reporterId","Employee ID"],["reporterName","Reported by"],["status","Status"],["acknowledgedBy","Acknowledged by"],["assignedTo","Handled by"],["instruction","Action plan"],["fixNote","Resolution"],["pdpa","PDPA decision"],["description","Description"]];
  const q=v=>`"${String(v==null?"":v).replace(/"/g,'""')}"`;
  return [cols.map(c=>q(c[1])).join(",")].concat(rows.map(r=>cols.map(([k])=>q(k==="typeId"?typeName(r[k]):r[k])).join(","))).join("\r\n");
}
function exportCsv(rows,name){
  const csv=toCsv(rows), file=`${name}-${new Date().toISOString().slice(0,10)}.csv`;
  try{ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"})); a.download=file; document.body.appendChild(a); a.click(); a.remove(); }catch(e){}
  showTextModal("Report exported",`The file <b class="mono">${file}</b> is downloading (${rows.length} records). If your browser blocked the download, copy the text below and paste it into Excel or Google Sheets.`,csv);
  audit(`Exported ${rows.length} records to CSV`);
}
function showTextModal(title,html,text){

}

function detectPatterns(data){
  const now=Date.now(), day=864e5, out=[];
  const inWin=(i,a,b)=>{const t=new Date(i.reportedAt).getTime();return t>now-a*day&&t<=now-b*day;};
  INCIDENT_TYPES.forEach(t=>{
    const cur=data.filter(i=>i.typeId===t.id&&inWin(i,7,0)).length, prev=data.filter(i=>i.typeId===t.id&&inWin(i,14,7)).length;
    if(cur>=3&&cur>prev) out.push({tag:"Rising",text:`<b>${esc(t.name)}</b>: ${cur} reports in the last 7 days, up from ${prev} the week before.`});
  });
  const groups={};
  data.filter(i=>inWin(i,7,0)).forEach(i=>{const k=i.dept+"|"+i.typeId;(groups[k]=groups[k]||[]).push(i);});
  Object.entries(groups).forEach(([k,v])=>{ if(v.length>=3){ const [d,t]=k.split("|"); out.push({tag:"Recurring",text:`<b>${esc(d)}</b> reported <b>${esc(typeName(t))}</b> ${v.length} times this week (${v.map(x=>x.id).slice(-4).join(", ")}). This may point to one targeted account or a training gap.`}); }});
  const sys={}; data.filter(i=>inWin(i,7,0)&&SEV_RANK[i.severity]>=3).forEach(i=>sys[i.system]=(sys[i.system]||0)+1);
  Object.entries(sys).forEach(([s,n])=>{ if(n>=3) out.push({tag:"Hotspot",text:`<b>${esc(s)}</b> was involved in ${n} high or critical incidents this week.`}); });
  const recent=data.filter(i=>inWin(i,30,0)), night=recent.filter(i=>{const h=new Date(i.occurredAt).getHours();return h>=22||h<6;});
  if(recent.length&&night.length/recent.length>=.25) out.push({tag:"After hours",text:`${Math.round(night.length/recent.length*100)}% of incidents in the last 30 days happened between 22:00 and 06:00, when fewer staff are on duty.`});
  const guest=recent.filter(i=>i.guestData==="Yes").length;
  if(guest) out.push({tag:"Guest data",text:`${guest} incident${guest===1?"":"s"} in the last 30 days involved guest information and need a PDPA decision.`});
  return out;
}
function lineChart(series,labels){
  const W=640,H=220,L=34,R=24,T=14,B=30, max=Math.max(4,...series), step=Math.ceil(max/4);
  const top=step*4, x=i=>L+i*(W-L-R)/(series.length-1), y=v=>T+(H-T-B)*(1-v/top);
  let g=""; for(let v=0;v<=top;v+=step){ g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--chart-grid)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`; }
  const pts=series.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const area=`M${x(0)},${y(0)} L${pts.replace(/ /g," L")} L${x(series.length-1)},${y(0)} Z`;
  const lbl=labels.map((l,i)=>i%Math.ceil(labels.length/7)===0||i===labels.length-1?`<text x="${x(i)}" y="${H-10}" text-anchor="middle">${l}</text>`:"").join("");
  const li=series.length-1;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Incidents reported per day">${g}<path d="${area}" fill="var(--chart-1)" fill-opacity=".10"/><polyline points="${pts}" fill="none" stroke="var(--chart-1)" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="${x(li)}" cy="${y(series[li])}" r="4.5" fill="var(--brand)"/><text x="${x(li)-8}" y="${y(series[li])-9}" text-anchor="end" style="font-weight:700;fill:var(--ink)">${series[li]} today</text>${lbl}</svg>`;
}
function barList(counts,max){ return `<div class="bars">${counts.map(([k,n])=>`<div class="bar-row"><span class="lbl" title="${esc(k)}">${esc(k)}</span><div class="bar-track"><div class="bar-fill" style="width:${max?n/max*100:0}%"></div></div><span class="n">${n}</span></div>`).join("")}</div>`; }

  const role=state.user.role, msgs=[];
  d.forEach(i=>{
    const before=state.knownStatus.get(i.id);
    if(before===undefined){ if(role!=="staff") msgs.push([`New ${i.severity} incident ${i.id}: ${typeName(i.typeId)} (${i.dept})`,i.severity==="critical"]); }
    else if(before!==i.status){
      if(role==="manager") msgs.push([`${i.id} is now ${i.status}.`,false]);
      if(role==="staff"&&i.reporterId===state.user.empId) msgs.push([`Your report ${i.id} is now: ${i.status}.`,false]);
    }
  });
  if(msgs.length||d.length!==state.knownStatus.size){
    msgs.forEach(([m,c])=>toast(m,c));
    const ae=document.activeElement, typing=ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName);
    if(!document.querySelector(".modal-back")&&!typing&&state.tab!=="report"&&state.tab!=="system") rerender(); else snapshotStatuses();
  }
}

setInterval(checkForUpdates,POLL_MS);
setInterval(()=>{ if(document.visibilityState==="visible") pullShared(); },SYNC_MS);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") pullShared(); });
window.addEventListener("storage",e=>{ if(e.key==="lxsw:incidents") checkForUpdates(); });
if(channel) channel.onmessage=()=>checkForUpdates();

/* daily automatic snapshot when the IT admin is signed in */
function autoSnap(){ if(state.user&&state.user.role==="admin"){ const b=store.get("backups",[]); if(!b.length||Date.now()-new Date(b[0].at)>864e5){ b.unshift({at:new Date().toISOString(),by:"Automatic",data:incidents()}); store.set("backups",b.slice(0,7)); } } }

/* ---------- Boot ---------- */
(function boot(){
  incidents();
  const s=store.get("session",null), u=s&&USERS.find(x=>x.username===s.username);
  if(u&&Date.now()-s.last<SESSION_TIMEOUT_MIN*6e4){ state.user=u; state.tab=ROLE_TABS[u.role][0]; renderShell(); }
  else renderLogin();
  autoSnap();
  pullShared();
})();
</script>
